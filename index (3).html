<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080612">
<title>TAIWAN PREDICTION – Join Free Community</title>
<meta name="description" content="Join the TAIWAN PREDICTION community on WhatsApp for community and official channel updates.">

<style>
  /* ==================== EDIT COLORS HERE ==================== */
  :root {
    --bg: #080612;            /* page background (matches reference theme-color) */
    --bg-glow: #1a1033;       /* soft glow behind the content */
    --card: #120d24;          /* benefit card background */
    --card-border: rgba(255,255,255,.08);
    --text: #ffffff;
    --text-soft: #d6d2e6;
    --btn-bg: #25d366;        /* WhatsApp green */
    --btn-bg-hover: #1fbd5a;
    --btn-text: #06140b;
    --max-width: 440px;
  }
  /* ========================================================== */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, var(--bg) 60%) var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: var(--max-width);
    padding: 36px 20px 48px;
    text-align: center;
  }

  .logo {
    width: 112px; height: 112px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.12);
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
    background: var(--card);
  }
  .brand {
    margin: 0 0 22px;
    font-size: clamp(1.6rem, 6.5vw, 2rem);
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 56px;
    padding: 14px 24px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(37,211,102,.28);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover { background: var(--btn-bg-hover); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(37,211,102,.38); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn svg { width: 26px; height: 26px; flex: none; fill: currentColor; }

  h2 {
    margin: 40px 0 18px;
    font-size: clamp(1.3rem, 5.5vw, 1.6rem);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  .benefits {
    list-style: none;
    margin: 0 0 28px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .benefits li {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 15px 18px;
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text-soft);
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }

  @media (min-width: 768px) {
    main { padding-top: 64px; }
    .logo { width: 128px; height: 128px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <img id="logo" class="logo" alt="TAIWAN PREDICTION logo" width="112" height="112" decoding="async">
  <h1 class="brand" id="brand"></h1>

  <a class="btn js-join" href="#" target="_blank" rel="noopener noreferrer">

    <span class="js-btn-text"></span>
  </a>

  <h2 id="headline"></h2>
  <ul class="benefits" id="benefits"></ul>

  <a class="btn js-join" href="#" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.04 2C6.5 2 2 6.5 2 12.04c0 1.77.46 3.5 1.34 5.02L2 22l5.06-1.33a10 10 0 0 0 4.98 1.27C17.58 21.94 22 17.5 22 12.04 22 6.5 17.55 2 12.04 2z"/></svg>
    <span class="js-btn-text"></span>
  </a>
</main>

<script>
  /* ==================== EDIT CONTENT HERE ==================== */
  const CONFIG = {
    brandName: "TAIWAN PREDICTION",
    headline: "JOIN FREE COMMUNITY",
    buttonText: "JOIN COMMUNITY",
    // Put your logo file next to index.html (e.g. wa.jpg) or use a full image URL.
    logoSrc: "wa.jpg",
    // WhatsApp invitation link (same link used by reference page's buttons).
    whatsappUrl: "https://www.whatsapp.com/channel/0029Vb9ifmC2f3EH7Qh3fX2O",
    benefits: [
      "⚡ Easy to Join Community",
      "🛡️ Latest Community Updates",
      "📲 Official Channel Updates",
      "🤝 24/7 Community Access"
    ]
  };
  /* =========================================================== */

  document.getElementById("brand").textContent = CONFIG.brandName;
  document.getElementById("headline").textContent = CONFIG.headline;
  document.querySelectorAll(".js-btn-text").forEach(el => el.textContent = CONFIG.buttonText);
  document.querySelectorAll(".js-join").forEach(a => a.href = CONFIG.whatsappUrl);

  const list = document.getElementById("benefits");
  CONFIG.benefits.forEach(text => {
    const li = document.createElement("li");
    li.textContent = text;
    list.appendChild(li);
  });

  const logo = document.getElementById("logo");
  logo.src = CONFIG.logoSrc;
  // If the logo file is missing, hide it instead of showing a broken image.
  logo.addEventListener("error", () => { logo.style.display = "none"; });
</script>
</body>
</html>
